# This file contains file paths and any other shared settings used by the scripts in this repository.
# To retain local settings, create a file called "environment.local.cfg" and add any settings you want to override in that file. This file should not be checked into version control.

AnnovarPATH=/opt/annovar # Where the Annovar program is
defaultGeneDb=ensGene # Default gene database to use for annotation
GencodeVersion=50
GencodeURL=https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_${GencodeVersion}/gencode.v${GencodeVersion}.primary_assembly.basic.annotation.gtf.gz
GencodeGTF=${HOME}/Public/RefSeq/GFF/gencode.v${GencodeVersion}.primary_assembly.basic.annotation.gtf.gz
# Identify the ANNOVAR database folder from the genome build.
case $BUILD in
    hg19)
        AV_DB=/opt/annovar/humandb/
        ;;
    Hs38DH)
        AV_DB=/opt/annovar/humandb/hg38/
        ;;
    hg38)
        AV_DB=/opt/annovar/humandb/hg38/
        ;;
    *) # If it is anything else or not set, default to Hs38DH
        echo "Setting genome build to the default Hs38DH"
        BUILD=Hs38DH
        AV_DB=/opt/annovar/humandb/hg38/
        ;;
esac
